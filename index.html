<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Everything Wiki</title>
    <style>
        /* CSS STYLES */
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --text-muted: #666666;
            --sidebar-bg: #1e1e2d;
            --sidebar-text: #ffffff;
            --accent-color: #6c5ce7;
            --accent-hover: #5b4bc4;
            --border-color: #e0e0e0;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --text-muted: #aaa;
            --sidebar-bg: #0a0a0c;
            --sidebar-text: #e0e0e0;
            --border-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        /* Sidebar Styling */
        sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            color: var(--sidebar-text);
            padding: 20px;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
        }

        sidebar h2 {
            margin-bottom: 20px;
            color: var(--accent-color);
        }

        sidebar nav a {
            display: block;
            color: var(--sidebar-text);
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 5px;
            transition: 0.2s;
        }

        sidebar nav a:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .theme-toggle-btn {
            margin-top: auto;
            padding: 10px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .theme-toggle-btn:hover {
            background-color: var(--accent-hover);
        }

        /* Main Content Layout */
        main {
            margin-left: 260px;
            flex: 1;
            padding: 40px;
        }

        header {
            margin-bottom: 30px;
        }

        .search-bar {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 1rem;
            margin-top: 15px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 1.5rem;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--accent-color);
            display: inline-block;
            padding-bottom: 5px;
        }

        /* Grid for Cards */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h3 {
            margin-bottom: 10px;
            color: var(--accent-color);
        }

        .card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.4;
        }

        /* Member Profile Cards */
        .member-card {
            text-align: center;
            cursor: pointer;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: var(--accent-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            margin: 0 auto 15px;
        }

        /* Modal Popup */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 10px;
            max-width: 400px;
            width: 90%;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            sidebar { width: 100%; height: auto; position: relative; }
            main { margin-left: 0; padding: 20px; }
        }

        del {
            color: #888888;
            margin-right: 6px;
            text-decoration-color: #ff4d4d;
        }

        .avatar-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 15px;
            display: block;
        }
    </style>
</head>
<body>

    <!-- SIDEBAR NAVIGATION -->
    <sidebar>
        <h2>The <del>Everything</del> Something Wiki</h2>
        <nav>
            <a href="#rules">Lore</a>
            <a href="#members">Members</a>
            <!-- <a href="#memes">Memes</a> -->
        </nav>
        <button class="theme-toggle-btn" id="themeToggle">Toggle Dark Mode</button>
    </sidebar>

    <!-- MAIN CONTENT AREA -->
    <main>
        <header>
            <h1>Welcome to the Wiki of Something!</h1>
            <input type="text" id="searchInput" class="search-bar" placeholder="Search wiki entries, lore, or memes...">
        </header>

        <!-- RULES SECTION -->
        <section id="rules" class="section">
            <h2 class="section-title">Lore</h2>
            <div class="grid">
                <article class="card searchable">
                    <h3>Something</h3>
                    <p>I will put stuff here later.</p>
            </div>
        </section>

        <!-- MEMBERS SECTION -->
        <section id="members" class="section">
            <h2 class="section-title">People</h2>
            <div class="grid">
                <a href="people/funnypants123" class="card member-card searchable" style="text-decoration: none; color: inherit;">
                    <img src="funnypants123.png" alt="Funnypants123 Avatar" class="avatar-img">
                    <h3>Funnypants123</h3>
                    <p>A popular member of something</p>
                </a>
            </div>
        </section>
        <!--<section id="memes" class="section">
            <h2 class="section-title">Memes</h2>
            <div class="grid">
                <article class="card searchable">
                    <h3>"I'm 5 mins away"</h3>
                    <p>Translation: I haven't left my bed yet and haven't showered.</p>
                </article>
                <article class="card searchable">
                    <h3>The Pizza Incident</h3>
                    <p>That one time Alex ordered 10 pizzas for 3 people by accident.</p>
                </article>
            </div>
        </section>
        -->
    </main>

    <!-- 
    <div class="modal" id="profileModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modalName">Member Name</h2>
            <h4 id="modalRole" style="color: var(--accent-color); margin-bottom: 10px;">Role</h4>
            <p id="modalBio">Member bio goes here...</p>
        </div>
    </div>
    -->

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // 1. Dark / Light Mode Toggle
        const themeToggleBtn = document.getElementById('themeToggle');
        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = document.body.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                document.body.removeAttribute('data-theme');
                themeToggleBtn.textContent = 'Toggle Dark Mode';
            } else {
                document.body.setAttribute('data-theme', 'dark');
                themeToggleBtn.textContent = 'Toggle Light Mode';
            }
        });

        // 2. Search Functionality
        const searchInput = document.getElementById('searchInput');
        const searchableCards = document.querySelectorAll('.searchable');

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();

            searchableCards.forEach(card => {
                const text = card.textContent.toLowerCase();
                if (text.includes(query)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        });

        // 3. Modal Popup Logic
        const modal = document.getElementById('profileModal');
        const modalName = document.getElementById('modalName');
        const modalRole = document.getElementById('modalRole');
        const modalBio = document.getElementById('modalBio');

        function openModal(name, bio, role) {
            modalName.textContent = name;
            modalRole.textContent = role;
            modalBio.textContent = bio;
            modal.style.display = 'flex';
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        // Close modal when clicking outside the content box
        window.addEventListener('click', (e) => {
            if (e.target === modal) {
                closeModal();
            }
        });
    </script>
</body>
</html>
